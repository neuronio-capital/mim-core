  - "PrismaService cai silenciosamente para o papel owner se APP_DATABASE_URL não estiver definida, sem erro nem aviso."
  - "ADR-001 permanece com status \"Proposto\" (aguardando aprovação formal do fundador), embora o ADR-002 já opere sobre suas decisões (DEC-3) como se aceitas."
